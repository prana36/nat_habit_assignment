[project]
name = "taskflow"
version = "0.1.0"
description = "TaskFlow backend take-home assignment"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.13.2",
  "bcrypt==4.0.1",
  "celery==5.4.0",
  "fastapi==0.111.0",
  "passlib[bcrypt]==1.7.4",
  "psycopg[binary]==3.2.13",
  "pydantic-settings==2.4.0",
  "python-jose[cryptography]==3.3.0",
  "redis==5.0.8",
  "sqlalchemy==2.0.32",
  "uvicorn[standard]==0.30.6"
]

[project.optional-dependencies]
dev = [
  "httpx==0.27.0",
  "pytest==8.3.2",
  "pytest-cov==5.0.0",
  "ruff==0.5.7"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
